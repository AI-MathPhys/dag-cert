name: Lean

on:
  push:
    branches: [main]
    paths: ["lean/**", ".github/workflows/lean.yml"]
  pull_request:
    paths: ["lean/**", ".github/workflows/lean.yml"]
  workflow_dispatch:

jobs:
  build:
    name: Build the formalization and check axioms
    runs-on: ubuntu-latest
    timeout-minutes: 300
    defaults:
      run:
        working-directory: lean
    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Cache build outputs
        uses: actions/cache@v4
        with:
          path: lean/.lake
          key: lake-${{ hashFiles('lean/lean-toolchain', 'lean/lake-manifest.json') }}-${{ hashFiles('lean/JointRootCert/**/*.lean', 'lean/JointRootCert.lean') }}
          restore-keys: |
            lake-${{ hashFiles('lean/lean-toolchain', 'lean/lake-manifest.json') }}-

      - name: Fetch the Mathlib cache
        run: lake exe cache get

      - name: Build
        run: lake build

      - name: No sorry, admit or native_decide in the sources
        run: |
          if grep -nE '\bsorry\b|\badmit\b|native_decide|^axiom ' JointRootCert.lean JointRootCert/*.lean; then
            echo "forbidden construct found"; exit 1
          fi

      - name: Every indexed result uses only the standard axioms
        run: bash scripts/check_axioms.sh
