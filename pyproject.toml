[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dagcert"
dynamic = ["version"]
description = "Certify the decision, not the outcome: joint root certification and decision-aware Bayesian experimental design on search graphs."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
  {name = "Aurélien Pélissier"},
]
keywords = [
  "bayesian-experimental-design",
  "monte-carlo-tree-search",
  "pure-exploration",
  "best-arm-identification",
  "directed-acyclic-graph",
  "bayesian-optimization",
  "protein-engineering",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
]

[project.optional-dependencies]
# Independent CVXPY/Clarabel reference solvers (solver="cvxpy_socp") and oracle audits.
audit = [
  "cvxpy>=1.5",
  "clarabel>=0.7",
  "scs>=3.2",
]
# Everything needed to rerun the paper's experiments, figures and dataset builders.
experiments = [
  "matplotlib>=3.7",
  "pandas>=2.1",
  "requests>=2.28",
  "networkx>=3.2",
]
# Fresh uncached Qwen3-0.6B WorFBench suites.
llm = [
  "torch>=2.2",
  "transformers>=4.45",
  "huggingface-hub>=0.25",
  "accelerate>=0.30",
  "safetensors>=0.4",
]
dev = [
  "pytest>=7.0",
  "build>=1.2",
  "twine>=5.0",
]
all = ["dagcert[audit,experiments,llm,dev]"]

[project.urls]
Homepage = "https://github.com/AI-MathPhys/dag-cert"
Repository = "https://github.com/AI-MathPhys/dag-cert"
Issues = "https://github.com/AI-MathPhys/dag-cert/issues"
Paper = "https://github.com/AI-MathPhys/dag-cert/blob/main/manuscript/Joint_cert_manuscript.pdf"
Reproducibility = "https://github.com/AI-MathPhys/dag-cert/blob/main/REPRODUCIBILITY.md"

[tool.setuptools.dynamic]
version = {attr = "dagcert.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["dagcert*"]

[tool.setuptools.package-data]
dagcert = [
  "benchmarks/data/*.npz",
  "benchmarks/data/samegame/*.txt",
  "_native/*.cpp",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
  "native: needs a C++17 compiler ($CXX, g++ or clang++); skipped when none is found",
  "audit: needs the optional CVXPY/Clarabel solvers (pip install \"dagcert[audit]\"); skipped otherwise",
]
