[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dagcert"
version = "1.0.0"
description = "Joint Root Certification and Decision-Aware Bayesian Experimental Design on Search Graphs."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
  {name = "Aurélien Pélissier"},
]
keywords = [
  "bayesian-experimental-design",
  "monte-carlo-tree-search",
  "pure-exploration",
  "best-arm-identification",
  "directed-acyclic-graph",
  "bayesian-optimization",
  "protein-engineering",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "matplotlib>=3.7",
  "requests>=2.28",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
]
audit = [
  "cvxpy>=1.5",
  "clarabel>=0.7",
  "scs>=3.2",
]
llm = [
  "torch>=2.2",
  "transformers>=4.45",
  "huggingface-hub>=0.25",
  "accelerate>=0.30",
  "safetensors>=0.4",
]
all = [
  "pytest>=7.0",
  "cvxpy>=1.5",
  "clarabel>=0.7",
  "scs>=3.2",
  "torch>=2.2",
  "transformers>=4.45",
  "huggingface-hub>=0.25",
  "accelerate>=0.30",
  "safetensors>=0.4",
]

[project.urls]
Homepage = "https://github.com/AI-MathPhys/dagcert"
Repository = "https://github.com/AI-MathPhys/dagcert"

[tool.setuptools.packages.find]
where = ["."]
include = ["dagcert*"]

[tool.setuptools.package-data]
dagcert = [
  "benchmarks/data/*.npz",
  "benchmarks/data/samegame/*.txt",
  "_native/*.cpp",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
